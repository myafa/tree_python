{{define "content"}}
<h1>새 사안</h1>
<form method="post" action="/cases" class="card">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label for="title">메모용 제목 <span class="muted small">(목록에 보이는 이름. 비우면 사실관계 앞부분을 씁니다)</span></label>
  <input type="text" id="title" name="title" maxlength="100">
  <label for="agency">대상 기관 <span class="muted small">(예: 국방부, 육군본부. 모르면 비워 두세요)</span></label>
  <input type="text" id="agency" name="agency" maxlength="100">
  <label for="facts">사실관계 <span class="muted small">(언제, 어디서, 누가, 무엇을 했는지. 아는 사실만 적으세요)</span></label>
  <textarea id="facts" name="facts" rows="10" required></textarea>
  <label for="desired">원하는 결과</label>
  <textarea id="desired" name="desired" rows="3"></textarea>
  <div class="note small">이름·연락처·부대명 같은 개인정보는 AI 에 보내기 전에 이 PC 에서 가려집니다. 가릴 낱말은 <a href="/settings">설정</a>에서 정할 수 있습니다.</div>
  <div class="row"><button class="primary" type="submit">만들기</button></div>
</form>
{{end}}
